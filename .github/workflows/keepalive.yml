# The free Supabase plan pauses a project after a week without activity.
# Set the repository variable APP_URL (e.g. https://your-app.vercel.app) to enable this.
name: keep-alive
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error "${{ vars.APP_URL }}/api/keepalive"
